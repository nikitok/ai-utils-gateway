# Alfa (staging) environment overlay values
# These values override the base chart values

ai:
  replicaCount: 1

  # Environment specific configuration
  namespace: prod
  environment: prod

  image:
    tag: "v15.1.133"

  # Additional environment variables
  env:
    - name: ENVIR
      value: "production"

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1000m"
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-directual
      nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    hosts:
      - host: ai-utils.prod.directual.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: directual-prod-tls
        hosts:
          - ai-utils.prod.directual.com

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80