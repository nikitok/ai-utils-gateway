[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-utils"
version = "0.1.3"
description = "API to transform text to tensor and more utilities"
requires-python = ">=3.12"
authors = [
    { name = "Nikita Navalikhin", email = "noviiden@gmail.com" },
]
dependencies = [
    "fastapi[standard]>=0.100.0",
    "uvicorn>=0.23.2",
    "torch>=2.0.0",
    "transformers>=4.33.2",
    "requests>=2.32.3",
    "pdfreader>=0.1.15",
    "pypdf2>=3.0.1",
    "pyvespa>=0.55.0",
    "vespacli>=8.497.38",
    "openai-whisper>=20240930",
    "pydub>=0.25.1",
    "ffmpeg>=1.4",
    "openai>=1.68.2",
    "pdf2image>=1.17.0",
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.21.0",
    "pydantic-settings>=2.0.0",
    "dependency-injector>=4.41.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
]

[project.scripts]
ai-utils = "src.aiutils.main:app"
