name: ArgoCD Update Version

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
  workflow_run:
    workflows: ["Build and Push to GitLab Registry"]
    types:
      - completed
    branches: [ master, main ]

jobs:
  update-argocd:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout ArgoCD config repo
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.ARGOCD_REPO }}
        token: ${{ secrets.ARGOCD_GITHUB_TOKEN }}
        path: argocd-config

    - name: Get image tag
      id: get-tag
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Update Kubernetes manifests
      run: |
        cd argocd-config
        
        # Find and update image tags in Kubernetes manifests
        find . -name "*.yaml" -o -name "*.yml" | while read file; do
          if grep -q "image:.*directual-ai-utils" "$file"; then
            sed -i "s|image:.*directual-ai-utils:.*|image: ${{ secrets.GITLAB_REGISTRY }}/${{ secrets.GITLAB_PROJECT_PATH }}/directual-ai-utils:${{ steps.get-tag.outputs.tag }}|g" "$file"
            echo "Updated $file"
          fi
        done

    - name: Update Chart version
      run: |
        cd argocd-config
        
        # Update Chart.yaml version if exists
        if [ -f "Chart.yaml" ]; then
          # Increment patch version
          current_version=$(grep "^version:" Chart.yaml | awk '{print $2}')
          IFS='.' read -ra VERSION_PARTS <<< "$current_version"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          sed -i "s/^version:.*/version: $NEW_VERSION/" Chart.yaml
          
          # Update appVersion
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.get-tag.outputs.tag }}\"/" Chart.yaml
          
          echo "Updated Chart version to $NEW_VERSION"
        fi

    - name: Update values.yaml
      run: |
        cd argocd-config
        
        # Update values.yaml if exists
        if [ -f "values.yaml" ] || [ -f "*/values.yaml" ]; then
          find . -name "values.yaml" | while read file; do
            # Update image tag
            yq eval '.image.tag = "${{ steps.get-tag.outputs.tag }}"' -i "$file"
            # Update image repository if needed
            yq eval '.image.repository = "${{ secrets.GITLAB_REGISTRY }}/${{ secrets.GITLAB_PROJECT_PATH }}/directual-ai-utils"' -i "$file"
            echo "Updated $file"
          done
        fi

    - name: Commit and push changes
      run: |
        cd argocd-config
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        git add .
        git commit -m "Update directual-ai-utils to ${{ steps.get-tag.outputs.tag }}"
        git push

    - name: Create deployment record
      uses: actions/github-script@v7
      with:
        script: |
          const tag = '${{ steps.get-tag.outputs.tag }}';
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
            environment: 'production',
            description: `Deploy ${tag} to ArgoCD`,
            auto_merge: false,
            required_contexts: []
          });
          
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: deployment.data.id,
            state: 'success',
            environment_url: '${{ secrets.ARGOCD_SERVER_URL }}',
            description: 'Deployment manifest updated'
          });