name: Build and Push to GitLab Registry

on:
  push:
    branches: [ master, main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

env:
  GITLAB_REGISTRY: registry.gitlab.com
  GITLAB_PROJECT_PATH: ${{ secrets.GITLAB_PROJECT_PATH }}
  IMAGE_NAME: ai-utils

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitLab Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GITLAB_REGISTRY }}
        username: ${{ secrets.GITLAB_USERNAME }}
        password: ${{ secrets.GITLAB_TOKEN }}

    - name: Validate environment variables
      run: |
        if [ -z "${{ env.GITLAB_PROJECT_PATH }}" ]; then
          echo "ERROR: GITLAB_PROJECT_PATH secret is not set"
          echo "Please set GITLAB_PROJECT_PATH in GitHub Secrets (format: group/project)"
          exit 1
        fi

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.GITLAB_REGISTRY }}/${{ env.GITLAB_PROJECT_PATH }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max