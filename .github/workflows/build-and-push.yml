name: Build and Push to GitLab Registry

on:
  push:
    tags: [ 'v*' ]

env:
  GITLAB_REGISTRY: registry.gitlab.com
  GITLAB_PROJECT_PATH: ${{ secrets.GITLAB_PROJECT_PATH }}
  IMAGE_NAME: ai-utils

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitLab Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.GITLAB_REGISTRY }}
        username: ${{ secrets.GITLAB_USERNAME }}
        password: ${{ secrets.GITLAB_TOKEN }}

    - name: Validate environment variables
      run: |
        if [ -z "${{ env.GITLAB_PROJECT_PATH }}" ]; then
          echo "ERROR: GITLAB_PROJECT_PATH secret is not set"
          echo "Please set GITLAB_PROJECT_PATH in GitHub Secrets (format: group/project)"
          exit 1
        fi

    - name: Get version from tag or file
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        elif [ -f .bumpversion.cfg ]; then
          VERSION=$(grep "^current_version" .bumpversion.cfg | sed 's/current_version = //')
        else
          VERSION="0.1.0"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.GITLAB_REGISTRY }}/${{ env.GITLAB_PROJECT_PATH }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          type=sha,prefix={{branch}}-

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Update Helm values for staging
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      run: |
        # Install yq for YAML processing
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod a+x /usr/local/bin/yq
        
        # Get the tag to use
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          TAG=${GITHUB_REF#refs/tags/}
        else
          TAG="${{ steps.version.outputs.version }}"
        fi
        
        # Update the helm values file
        yq eval '.ai.image.tag = "'$TAG'"' -i .helm/overlays/staging/values.yaml
        
        # Check if there are changes
        if ! git diff --quiet .helm/overlays/staging/values.yaml; then
          echo "Updating helm values with new tag: $TAG"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit and push
          git add .helm/overlays/staging/values.yaml
          git commit -m "chore: update staging image tag to $TAG [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}
        else
          echo "No changes to commit"
        fi