name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install bump2version
      run: pip install bump2version

    - name: Configure git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Check if bumpversion config exists
      run: |
        if [ ! -f .bumpversion.cfg ]; then
          echo "Creating initial .bumpversion.cfg"
          cat > .bumpversion.cfg << 'EOF'
        [bumpversion]
        current_version = 0.1.0
        commit = True
        tag = True
        tag_name = v{new_version}
        
        [bumpversion:file:pyproject.toml]
        search = version = "{current_version}"
        replace = version = "{new_version}"
        
        [bumpversion:file:src/aiutils/__init__.py]
        search = __version__ = "{current_version}"
        replace = __version__ = "{new_version}"
        EOF
        fi

    - name: Get current version
      id: current
      run: |
        current_version=$(grep "^current_version" .bumpversion.cfg | sed 's/current_version = //')
        echo "Current version found: $current_version"
        echo "current_version=$current_version" >> $GITHUB_OUTPUT

    - name: Bump version
      run: |
        bump2version ${{ github.event.inputs.version_type }} --no-tag --no-commit

    - name: Get new version
      id: new
      run: |
        new_version=$(grep "^current_version" .bumpversion.cfg | sed 's/current_version = //')
        echo "New version found: $new_version"
        echo "new_version=$new_version" >> $GITHUB_OUTPUT

    - name: Commit and tag
      run: |
        git add .
        git commit -m "Bump version: ${{ steps.current.outputs.current_version }} → ${{ steps.new.outputs.new_version }}"
        git tag -a "v${{ steps.new.outputs.new_version }}" -m "Bump version: ${{ steps.current.outputs.current_version }} → ${{ steps.new.outputs.new_version }}"

    - name: Push changes
      run: |
        git push origin HEAD:${GITHUB_REF#refs/heads/} --follow-tags

    - name: Create Pull Request for version bump
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "Bump version to ${{ steps.new.outputs.new_version }}"
        title: "Bump version to ${{ steps.new.outputs.new_version }}"
        body: |
          Automated version bump from ${{ github.event.inputs.version_type }}
          
          New version: ${{ steps.new.outputs.new_version }}
        branch: bump-version-${{ steps.new.outputs.new_version }}
        delete-branch: true