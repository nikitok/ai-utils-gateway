name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version type to bump'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install bump2version
      run: pip install bump2version

    - name: Configure git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Check if bumpversion config exists
      run: |
        if [ ! -f .bumpversion.cfg ]; then
          echo "Creating initial .bumpversion.cfg"
          cat > .bumpversion.cfg << 'EOF'
        [bumpversion]
        current_version = 0.1.0
        commit = True
        tag = True
        tag_name = v{new_version}
        
        [bumpversion:file:pyproject.toml]
        search = version = "{current_version}"
        replace = version = "{new_version}"
        
        [bumpversion:file:src/aiutils/__init__.py]
        search = __version__ = "{current_version}"
        replace = __version__ = "{new_version}"
        EOF
        fi

    - name: Get current version
      id: current
      run: |
        current_version=$(grep "^current_version" .bumpversion.cfg | sed 's/current_version = //')
        echo "Current version found: $current_version"
        echo "current_version=$current_version" >> $GITHUB_OUTPUT

    - name: Bump version
      run: |
        bump2version ${{ github.event.inputs.version_type }} --no-tag --no-commit

    - name: Get new version
      id: new
      run: |
        new_version=$(grep "^current_version" .bumpversion.cfg | sed 's/current_version = //')
        echo "New version found: $new_version"
        echo "new_version=$new_version" >> $GITHUB_OUTPUT

    - name: Commit and tag
      run: |
        git add .
        git commit -m "Bump version: ${{ steps.current.outputs.current_version }} → ${{ steps.new.outputs.new_version }}"
        git tag -a "v${{ steps.new.outputs.new_version }}" -m "Bump version: ${{ steps.current.outputs.current_version }} → ${{ steps.new.outputs.new_version }}"

    - name: Push changes
      run: |
        git push origin HEAD:${GITHUB_REF#refs/heads/} --follow-tags
        
#    - name: Trigger build workflow
#      if: success()
#      run: |
#        # Wait a moment for the push to be processed
#        sleep 5
#
#        # Trigger the build workflow using the tag
#        curl -X POST \
#          -H "Accept: application/vnd.github.v3+json" \
#          -H "Authorization: token ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}" \
#          https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-and-push.yml/dispatches \
#          -d '{"ref":"v${{ steps.new.outputs.new_version }}"}'

    - name: Create Release
      if: success()
      run: |
        gh release create "v${{ steps.new.outputs.new_version }}" \
          --title "Release v${{ steps.new.outputs.new_version }}" \
          --notes "## Version ${{ steps.new.outputs.new_version }}
          
        Automated version bump: ${{ github.event.inputs.version_type }}
        
        Previous version: ${{ steps.current.outputs.current_version }}" \
          --target "${GITHUB_REF#refs/heads/}"
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}